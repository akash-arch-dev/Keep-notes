<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="keepGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#78350F" flood-opacity="0.25"/>
    </filter>
  </defs>
  <!-- Background squircle -->
  <rect width="512" height="512" rx="128" fill="#FFFBEB"/>
  <!-- Multi-page back note -->
  <rect x="130" y="90" width="270" height="340" rx="24" fill="#FDE68A" transform="rotate(6 265 260)" filter="url(#shadow)"/>
  <!-- Main note -->
  <rect x="110" y="85" width="280" height="340" rx="28" fill="url(#keepGrad)" filter="url(#shadow)"/>
  <!-- Note header line -->
  <rect x="150" y="140" width="120" height="18" rx="9" fill="#78350F" opacity="0.85"/>
  <!-- Note text lines -->
  <rect x="150" y="180" width="200" height="12" rx="6" fill="#92400E" opacity="0.6"/>
  <rect x="150" y="210" width="170" height="12" rx="6" fill="#92400E" opacity="0.6"/>
  <rect x="150" y="240" width="190" height="12" rx="6" fill="#92400E" opacity="0.6"/>
  
  <!-- Quill / Pen icon accent -->
  <circle cx="340" cy="340" r="44" fill="#FFFFFF" filter="url(#shadow)"/>
  <path d="M348 316 L356 324 L328 352 L320 354 L322 346 Z" fill="#D97706" stroke="#B45309" stroke-width="2"/>
  <path d="M356 324 C360 320 360 314 356 310 C352 306 346 306 342 310 L348 316 Z" fill="#F59E0B"/>
  <!-- Page badge indicating multi-page -->
  <g transform="translate(148, 320)">
    <rect width="64" height="26" rx="13" fill="#FFFFFF" opacity="0.9"/>
    <text x="32" y="18" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="bold" fill="#B45309" text-anchor="middle">P.1/3</text>
  </g>
</svg>
