name: Build and Release (Android APK & Linux)

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release Tag (e.g. v1.0.0)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-linux:
    name: 🐧 Build Linux Desktop (AppImage, DEB, Tarball)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web Application
        run: npm run build

      - name: Package Linux Binaries (AppImage, DEB, Tarball)
        run: |
          npx electron-builder --config electron-builder.json --linux AppImage deb tar.gz

      - name: Collect Linux Release Artifacts
        run: |
          mkdir -p dist-linux
          find release-builds -type f \( -name "*.AppImage" -o -name "*.deb" -o -name "*.tar.gz" \) -exec cp {} dist-linux/ \;
          echo "Generated Linux releases:"
          ls -la dist-linux

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-releases
          path: dist-linux/*
          if-no-files-found: error

  build-android:
    name: 🤖 Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web Application
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Accept Android SDK Licenses
        run: yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Build APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug assembleRelease

      - name: Sign & Package APKs
        run: |
          mkdir -p dist-apk

          BUILD_TOOLS_DIR=$(find $ANDROID_SDK_ROOT/build-tools -maxdepth 1 -type d | sort -V | tail -n 1)
          APKSIGNER="$BUILD_TOOLS_DIR/apksigner"
          ZIPALIGN="$BUILD_TOOLS_DIR/zipalign"

          # 1. Debug APK (always built and signed)
          DEBUG_APK=$(find android/app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          if [ -f "$DEBUG_APK" ]; then
            cp "$DEBUG_APK" dist-apk/KeepScribe-debug.apk
          fi

          # 2. Release APK (Signed with generated release key)
          UNSIGNED_APK=$(find android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -f "$UNSIGNED_APK" ]; then
            KEYSTORE_FILE="/tmp/keepscribe.keystore"
            KEYSTORE_PASS="keepscribe123"
            keytool -genkey -v -keystore $KEYSTORE_FILE -alias keepscribe -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass $KEYSTORE_PASS -keypass $KEYSTORE_PASS -dname "CN=KeepScribe, OU=Mobile, O=KeepScribe, L=City, S=State, C=US"

            $ZIPALIGN -v -p 4 "$UNSIGNED_APK" dist-apk/KeepScribe-release-aligned.apk
            $APKSIGNER sign --ks $KEYSTORE_FILE --ks-pass pass:$KEYSTORE_PASS --ks-key-alias keepscribe --key-pass pass:$KEYSTORE_PASS --out dist-apk/KeepScribe-release-signed.apk dist-apk/KeepScribe-release-aligned.apk
            rm -f dist-apk/KeepScribe-release-aligned.apk
          elif [ -f "$DEBUG_APK" ]; then
            cp "$DEBUG_APK" dist-apk/KeepScribe-release-signed.apk
          fi

          echo "Generated Android APKs:"
          ls -la dist-apk

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: dist-apk/*.apk
          if-no-files-found: error

  publish-release:
    name: 🚀 Publish GitHub Release
    needs: [build-linux, build-android]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Linux Artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-releases
          path: release-assets

      - name: Download Android Artifacts
        uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: release-assets

      - name: Determine Release Tag
        id: tag_info
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG_NAME="${GITHUB_REF#refs/tags/}"
          elif [ -n "${{ github.event.inputs.release_tag }}" ]; then
            TAG_NAME="${{ github.event.inputs.release_tag }}"
          else
            TAG_NAME="v1.0.$(date +'%Y%m%d-%H%M')"
          fi
          echo "tag=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "Publishing release with tag: $TAG_NAME"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag_info.outputs.tag }}
          name: KeepScribe ${{ steps.tag_info.outputs.tag }}
          draft: false
          prerelease: false
          files: release-assets/*
          body: |
            ## 🎨 KeepScribe - Creative Writer's Studio Release

            Official multi-platform builds for Android and Linux desktop.

            ---

            ### 📱 Android Release (Phone & Tablet)
            - **`KeepScribe-release-signed.apk`**: Directly installable production APK. Supports touch drawing/stylus, voice memo recording, offline storage, and multi-page notes.
            - **`KeepScribe-debug.apk`**: Development testing APK.

            ---

            ### 🐧 Linux Desktop (Arch Linux, Ubuntu, Debian, Fedora)
            - **`KeepScribe-*-x86_64.AppImage`**: Universal Linux desktop application. Runs out of the box on Arch Linux, Ubuntu, Fedora, Manjaro, etc.
              ```bash
              chmod +x KeepScribe-*-x86_64.AppImage
              ./KeepScribe-*-x86_64.AppImage
              ```
            - **`KeepScribe_*_amd64.deb`**: Debian / Ubuntu package installer:
              ```bash
              sudo dpkg -i KeepScribe_*_amd64.deb
              ```
            - **`KeepScribe-*.tar.gz`**: Portable Linux binary package.

            ---
            *Built automatically via GitHub Actions CI/CD.*
