name: Build and Release

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag (e.g. v1.0.0)
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      - name: Build Web Application
        run: npm run build

      # --publish never: stops electron-builder from trying to upload to GitHub
      # itself (it fails with "GH_TOKEN is not set" on tag builds otherwise).
      - name: Build Linux Packages
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder --config electron-builder.json --linux AppImage deb tar.gz --x64 --publish never

      - name: Collect Artifacts
        run: |
          mkdir -p dist-linux
          # Searches common electron-builder output folders so it works
          # whatever "directories.output" is set to in electron-builder.json
          for d in release-builds release dist dist-electron out; do
            [ -d "$d" ] || continue
            find "$d" -maxdepth 2 -type f \( \
              -name "*.AppImage" -o -name "*.deb" -o -name "*.tar.gz" \
            \) -not -path "*/node_modules/*" -exec cp -v {} dist-linux/ \;
          done

          ls -lh dist-linux
          test -n "$(find dist-linux -type f -print -quit)" || { echo "No Linux packages were produced"; exit 1; }

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-releases
          path: dist-linux/*
          if-no-files-found: error
          retention-days: 30

  build-android:
    name: Build Android
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      - name: Build Web Application
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync android

      # Secrets cannot be used directly in "if:", so a step output is used.
      # If keystore secrets are missing, the release APK is built unsigned
      # instead of the whole job failing.
      - name: Decode Release Keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 secret not set - release APK will be unsigned"
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build APKs (signed)
        if: steps.keystore.outputs.signed == 'true'
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug assembleRelease --no-daemon \
            -Pandroid.injected.signing.store.file="$KEYSTORE_PATH" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"

      - name: Build APKs (unsigned)
        if: steps.keystore.outputs.signed != 'true'
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug assembleRelease --no-daemon

      - name: Collect APKs
        env:
          SIGNED: ${{ steps.keystore.outputs.signed }}
        run: |
          mkdir -p dist-apk

          DEBUG_APK=$(find android/app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          RELEASE_APK=$(find android/app/build/outputs/apk/release -name "*.apk" | head -n 1)

          test -n "$DEBUG_APK" || { echo "Debug APK not found"; exit 1; }
          test -n "$RELEASE_APK" || { echo "Release APK not found"; exit 1; }

          cp "$DEBUG_APK" dist-apk/KeepScribe-debug.apk
          if [ "$SIGNED" = "true" ]; then
            cp "$RELEASE_APK" dist-apk/KeepScribe-release-signed.apk
          else
            cp "$RELEASE_APK" dist-apk/KeepScribe-release-unsigned.apk
          fi

          ls -lh dist-apk

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: dist-apk/*.apk
          if-no-files-found: error
          retention-days: 30

  publish-release:
    name: Publish GitHub Release
    needs:
      - build-linux
      - build-android

    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')

    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download Linux Artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-releases
          path: release-assets

      - name: Download Android Artifacts
        uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: release-assets

      - name: Determine Release Tag
        id: tag_info
        env:
          INPUT_TAG: ${{ inputs.release_tag }}
          REF: ${{ github.ref }}
        run: |
          if [[ "$REF" == refs/tags/* ]]; then
            TAG="${REF#refs/tags/}"
          elif [[ -n "$INPUT_TAG" ]]; then
            TAG="$INPUT_TAG"
          else
            echo "A release tag is required."
            exit 1
          fi

          # Accepts v1.0.0 and also v1.0.0-beta.1 style tags
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: $TAG"
            exit 1
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: List Release Assets
        run: ls -lhR release-assets

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag_info.outputs.tag }}
          name: KeepScribe ${{ steps.tag_info.outputs.tag }}
          target_commitish: ${{ github.sha }}
          draft: false
          prerelease: ${{ contains(steps.tag_info.outputs.tag, '-') }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: release-assets/*
